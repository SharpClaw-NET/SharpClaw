name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - dev

  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  DOTNET_VERSION: 10.0.x
  TEST_PROJECT: SharpClaw.Tests/SharpClaw.Tests.csproj
  SHARPCLAW_SOURCE_ROOT: ${{ github.workspace }}

permissions:
  contents: read

# CI runs only what the maintainers can reproduce on a Linux workstation with the
# .NET SDK alone: no PowerShell, no Windows runner, no Windows-only tooling.
# Release tooling under build/ and scripts/ stays manual; see docs/Installers.md.
jobs:
  correctness:
    name: Correctness / ${{ matrix.domain }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: Architecture Core Dependencies
            filter: 'FullyQualifiedName~SharpClaw.Tests.Architecture.CoreDependencyGuardrailTests'
          - domain: Architecture Module Dependencies
            filter: 'FullyQualifiedName~SharpClaw.Tests.Architecture.RegistrationDependencyGuardrailTests|FullyQualifiedName~SharpClaw.Tests.Architecture.ProductionRegistrationNeutralityTests'
          - domain: Runtime Composition
            filter: 'FullyQualifiedName~SharpClaw.Tests.Architecture.CanonicalJobsRouteBoundaryTests|FullyQualifiedName~SharpClaw.Tests.Kernel.RuntimeHostCompositionTests|FullyQualifiedName~SharpClaw.Tests.Kernel.RuntimeStartupInterruptionTests|FullyQualifiedName~SharpClaw.Tests.Kernel.RuntimeBootstrapInterruptionTests|FullyQualifiedName~SharpClaw.Tests.Kernel.RemoteProxyLifecycleTests|FullyQualifiedName~SharpClaw.Tests.Kernel.RuntimeProviderModelCatalogTests|FullyQualifiedName~SharpClaw.Tests.Kernel.RuntimeTransactionOwnershipTests'
          - domain: Gateway Boundaries
            filter: 'FullyQualifiedName~SharpClaw.Tests.Gateway.GatewayContractsIsolationTests|FullyQualifiedName~SharpClaw.Tests.Gateway.GatewayEndpointGroupCatalogTests|FullyQualifiedName~SharpClaw.Tests.Gateway.GatewayInstanceLifecycleTests|FullyQualifiedName~SharpClaw.Tests.Gateway.GatewayRegistrationLoaderTests|FullyQualifiedName~SharpClaw.Tests.Gateway.InternalApiClientResolutionTests|FullyQualifiedName~SharpClaw.Tests.Gateway.SyntheticGatewayRegistrationTests|FullyQualifiedName~SharpClaw.Tests.Gateway.GatewayPrivateConfigurationTests|FullyQualifiedName~SharpClaw.Tests.Kernel.RemoteGatewayProxyTests|FullyQualifiedName~SharpClaw.Tests.Gateway.GatewayActionBoundaryTests|FullyQualifiedName~SharpClaw.Tests.Gateway.GatewayIngressAdmissionTests'
          - domain: Persistence Provider
            filter: 'FullyQualifiedName~SharpClaw.Tests.Persistence.ApiKeyEncryptorBytesTests|FullyQualifiedName~SharpClaw.Tests.Persistence.DatabaseProviderOptionsTests|FullyQualifiedName~SharpClaw.Tests.Persistence.ExternalPersistencePackageTests'
          - domain: Persistence Environment
            filter: 'FullyQualifiedName~SharpClaw.Tests.Persistence.EnvironmentTemplateTests|FullyQualifiedName~SharpClaw.Tests.Persistence.InstallationKeyCompatibilityTests'
          - domain: Persistence Instances
            filter: 'FullyQualifiedName~SharpClaw.Tests.Persistence.SharpClawInstanceLifecycleTests|FullyQualifiedName~SharpClaw.Tests.Persistence.SharpClawInstancePathsTests|FullyQualifiedName~SharpClaw.Tests.Persistence.InstanceLockOwnershipTests|FullyQualifiedName~SharpClaw.Tests.Persistence.MigrationAdmissionTests|FullyQualifiedName~SharpClaw.Tests.Persistence.DiscoveryCallbackOwnershipTests'
          - domain: Providers
            filter: 'FullyQualifiedName~SharpClaw.Tests.Providers.CapabilityResolverTests|FullyQualifiedName~SharpClaw.Tests.Providers.ProviderCredentialBindingTests'
          - domain: LlamaSharp
            filter: 'FullyQualifiedName~SharpClaw.Tests.Providers.LlamaSharp'
          - domain: Durable Storage
            filter: 'FullyQualifiedName~SharpClaw.Tests.DurableStorage'
          - domain: Direct Chat Kernel
            filter: 'FullyQualifiedName~SharpClaw.Tests.Kernel.DirectChatKernelTests|FullyQualifiedName~SharpClaw.Tests.Kernel.RuntimeKernelAdapterTests'
          - domain: Client Request Authority
            filter: 'FullyQualifiedName~SharpClaw.Tests.Frontend.ClientActionBoundaryTests|FullyQualifiedName~SharpClaw.Tests.Frontend.UnoClientStateTests|FullyQualifiedName~SharpClaw.Tests.ClientUno.ClientUnoStartupSwitchTests|FullyQualifiedName~SharpClaw.Tests.ClientUno.BundledProviderSetupTests|FullyQualifiedName~SharpClaw.Tests.Frontend.ModularFrontendTests|FullyQualifiedName~SharpClaw.Tests.Frontend.ModulePackageStoreTests|FullyQualifiedName~SharpClaw.Tests.ClientUno.BaseClientPageInventoryTests|FullyQualifiedName~SharpClaw.Tests.ClientUno.BaseClientFeatureOwnershipTests'
          - domain: Production Module Graph
            filter: 'FullyQualifiedName~SharpClaw.Tests.Kernel.DefaultModuleSetHostGateTests|FullyQualifiedName~SharpClaw.Tests.Kernel.PackagedSidecarReadinessTests|FullyQualifiedName~SharpClaw.Tests.Kernel.ModuleSettingsLoaderTests|FullyQualifiedName~SharpClaw.Tests.Kernel.SidecarOutputDrainTests'
          - domain: Publishing
            filter: 'FullyQualifiedName~SharpClaw.Tests.Publishing'
          - domain: CI Guardrails
            filter: 'FullyQualifiedName~SharpClaw.Tests.Ci.CiRequiredStatusCheckTests'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "$TEST_PROJECT" -p:Configuration=Release

      - name: Run correctness domain
        run: >
          dotnet test "$TEST_PROJECT"
          --configuration Release
          --no-restore
          --logger GitHubActions
          --filter "TestCategory!=PerformanceDiagnostic&TestCategory!=PerformanceGate&TestCategory!=PowerShell&(${{ matrix.filter }})"
