name: CI

on:
  push:
    branches:
      - main
      - dev
      - release/**

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - dev
      - release/**

  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  DOTNET_VERSION: 10.0.x
  TEST_PROJECT: ".\\SharpClaw.Tests\\SharpClaw.Tests.csproj"
  SHARPCLAW_SOURCE_ROOT: ${{ github.workspace }}

permissions:
  contents: read

jobs:
  correctness:
    name: Correctness / ${{ matrix.domain }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: Architecture Core Dependencies
            filter: 'FullyQualifiedName~SharpClaw.Tests.Architecture.CoreDependencyGuardrailTests'
          - domain: Architecture Module Dependencies
            filter: 'FullyQualifiedName~SharpClaw.Tests.Architecture.ModuleDependencyGuardrailTests'
          - domain: Runtime Composition
            filter: 'FullyQualifiedName~SharpClaw.Tests.Architecture.RemoteRuntimeCompositionBoundaryTests'
          - domain: Runtime Pairing
            filter: 'FullyQualifiedName~SharpClaw.Tests.Architecture.RemoteRuntimePairingClientTests|FullyQualifiedName~SharpClaw.Tests.Architecture.RemoteRuntimePairingRegistryClientTests|FullyQualifiedName~SharpClaw.Tests.Persistence.RemoteRuntimePairingRegistryJsonColdStoreTests'
          - domain: Runtime Transport
            filter: 'FullyQualifiedName~SharpClaw.Tests.Architecture.RemoteRuntimeBridgeOptionsTests|FullyQualifiedName~SharpClaw.Tests.Architecture.RemoteRuntimeBridgeRouteTests|FullyQualifiedName~SharpClaw.Tests.Architecture.RemoteRuntimeBridgeTransportTests|FullyQualifiedName~SharpClaw.Tests.Architecture.RemoteRuntimeBridgeConcurrencyLimiterTests'
          - domain: Runtime Multi Process
            filter: 'FullyQualifiedName~SharpClaw.Tests.Architecture.RemoteRuntimeMultiProcessTests'
          - domain: Gateway Boundaries
            filter: 'FullyQualifiedName~SharpClaw.Tests.Gateway.GatewayContractsIsolationTests|FullyQualifiedName~SharpClaw.Tests.Gateway.GatewayEndpointGroupCatalogTests|FullyQualifiedName~SharpClaw.Tests.Gateway.GatewayInstanceLifecycleTests|FullyQualifiedName~SharpClaw.Tests.Gateway.InternalApiClientResolutionTests|FullyQualifiedName~SharpClaw.Tests.Gateway.SyntheticGatewayModuleTests'
          - domain: Persistence Provider
            filter: 'FullyQualifiedName~SharpClaw.Tests.Persistence.ApiKeyEncryptorBytesTests|FullyQualifiedName~SharpClaw.Tests.Persistence.DatabaseProviderOptionsTests'
          - domain: Persistence Environment
            filter: 'FullyQualifiedName~SharpClaw.Tests.Persistence.EnvironmentTemplateTests|FullyQualifiedName~SharpClaw.Tests.Persistence.InstallationKeyCompatibilityTests'
          - domain: Persistence Instances
            filter: 'FullyQualifiedName~SharpClaw.Tests.Persistence.SharpClawInstanceLifecycleTests|FullyQualifiedName~SharpClaw.Tests.Persistence.SharpClawInstancePathsTests'
          - domain: Providers
            filter: 'FullyQualifiedName~SharpClaw.Tests.Providers.CapabilityResolverTests|FullyQualifiedName~SharpClaw.Tests.Providers.ProviderCredentialBindingTests'
          - domain: LlamaSharp
            filter: 'FullyQualifiedName~SharpClaw.Tests.Providers.LlamaSharp'
          - domain: Durable Storage
            filter: 'FullyQualifiedName~SharpClaw.Tests.DurableStorage'
          - domain: Direct Chat Kernel
            filter: 'FullyQualifiedName~SharpClaw.Tests.Kernel.DirectChatKernelTests'
          - domain: Publishing
            filter: 'FullyQualifiedName~SharpClaw.Tests.Publishing.PublishScriptDeploymentTests'
          - domain: CI Guardrails
            filter: 'FullyQualifiedName~SharpClaw.Tests.Ci.CiRequiredStatusCheckTests'
          - domain: Remote Runtime Session
            filter: 'FullyQualifiedName~SharpClaw.Tests.Architecture.RemoteRuntimeProxySessionTests|FullyQualifiedName~SharpClaw.Tests.Architecture.RemoteRuntimeProxySessionSecretsTests|FullyQualifiedName~SharpClaw.Tests.Architecture.RemoteRuntimeBridgeRevocationTests'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:TEST_PROJECT

      - name: Run correctness domain
        shell: pwsh
        run: >
          dotnet test $env:TEST_PROJECT
          --configuration Release
          --no-restore
          --logger GitHubActions
          --filter "TestCategory!=PerformanceDiagnostic&TestCategory!=PerformanceGate&(${{ matrix.filter }})"

  performance:
    name: Performance / ${{ matrix.domain }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: Remote Runtime Streamed Payload
            filter: 'FullyQualifiedName~SharpClaw.Tests.Architecture.RemoteRuntimeBridgePerformanceTests'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:TEST_PROJECT

      # Require this check in GitHub branch protection. It is the blocking
      # performance signal; diagnostic tiers remain local opt-in tests.
      - name: Run performance domain
        shell: pwsh
        run: >
          dotnet test $env:TEST_PROJECT
          --configuration Release
          --no-restore
          --logger GitHubActions
          --filter "TestCategory=PerformanceGate&(${{ matrix.filter }})"
